name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v2.0.1)'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release tag and source
        id: version
        shell: bash
        run: bash scripts/release-version.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (pinned)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross (Linux aarch64 only)
        if: matrix.use_cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('Cargo.lock') }}

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            # Thin LTO for cross builds to avoid OOM during linking
            export CARGO_PROFILE_RELEASE_LTO=thin
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=4
            cross build --locked --release --target ${{ matrix.target }} -p agentsniff -j2
          else
            cargo build --locked --release --target ${{ matrix.target }} -p agentsniff -j2
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARCHIVE="agentsniff-${VERSION}-${{ matrix.target }}.tar.gz"
          mkdir -p staging
          cp target/${{ matrix.target }}/release/agentsniff staging/
          cp LICENSE README.md staging/
          cd staging
          tar czf "../${ARCHIVE}" *
          cd ..
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARCHIVE="agentsniff-${VERSION}-${{ matrix.target }}.zip"
          mkdir -p staging
          cp target/${{ matrix.target }}/release/agentsniff.exe staging/
          cp LICENSE README.md staging/
          cd staging
          7z a "../${ARCHIVE}" *
          cd ..
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  checksums:
    name: Checksums, signatures, and upload
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release tag and source
        id: tag
        run: bash scripts/release-version.sh

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v2.2.3'

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Sign artifacts with cosign (keyless)
        run: |
          cd artifacts
          for file in *.tar.gz *.zip; do
            [ -f "$file" ] || continue
            echo "Signing $file..."
            cosign sign-blob --yes "$file" \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.pem"
          done
          # Sign the checksums manifest too
          cosign sign-blob --yes checksums.txt \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          files: artifacts/*
          body: |
            ## Pre-Built Binaries

            > **Tip:** the most reliable install path is `cargo install agentsniff` (or `cargo install agentsniff --features ebpf` for the kernel-side passive capture). The binaries below are convenient for users without a Rust toolchain.

            ### Install

            **macOS / Linux — one-liner:**
            ```bash
            curl -fsSL https://agentsniff.org/install.sh | bash
            ```

            **From crates.io:**
            ```bash
            cargo install agentsniff
            cargo install agentsniff --features ebpf   # optional eBPF passive capture
            ```

            **Docker:**
            ```bash
            docker pull ghcr.io/thirdkeyai/agentsniff
            ```

            **Manual download:** grab the matching archive for your platform from the assets below and verify the SHA256 against `checksums.txt`.

            ### Cosign verification

            Each archive is signed with [Sigstore cosign](https://docs.sigstore.dev/) via keyless OIDC. Verify with:

            ```bash
            cosign verify-blob \
              --certificate agentsniff-<tag>-<target>.tar.gz.pem \
              --signature   agentsniff-<tag>-<target>.tar.gz.sig \
              --certificate-identity="https://github.com/ThirdKeyAI/agentsniff/.github/workflows/release-binaries.yml@refs/tags/<tag>" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              agentsniff-<tag>-<target>.tar.gz
            ```

            `checksums.txt` is signed the same way (`checksums.txt.sig` / `checksums.txt.pem`).
          append_body: true
