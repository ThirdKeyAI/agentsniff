services:
  agentsniff:
    build: .
    container_name: agentsniff
    # The process binds non-loopback inside the container, so a strong API
    # token is mandatory even though the published host port is loopback-only.
    ports:
      - "127.0.0.1:9090:9090"
    command: ["serve", "--host", "0.0.0.0", "--port", "9090"]
    environment:
      AGENTSNIFF_API_TOKEN: ${AGENTSNIFF_API_TOKEN:?Set a 32-byte-or-longer AGENTSNIFF_API_TOKEN}
      AGENTSNIFF_TARGET_NETWORK: 192.168.1.0/24
      AGENTSNIFF_ENABLE_DNS_MONITOR: "false"
      AGENTSNIFF_ENABLE_TLS_FINGERPRINT: "false"
      AGENTSNIFF_ENABLE_TRAFFIC_ANALYZER: "false"
      AGENTSNIFF_ENABLE_SSE_DETECTOR: "false"
    restart: unless-stopped
    volumes:
      - agentsniff-state:/home/agentsniff/.agentsniff

  # Opt-in raw-socket SSE capture. This image does not contain eBPF programs.
  # For kernel DNS/TLS/process capture, use a host build with --features ebpf
  # and set AGENTSNIFF_EBPF_INTERFACE to the interface to attach.
  agentsniff-passive:
    profiles: ["passive"]
    build: .
    container_name: agentsniff-passive
    network_mode: host
    # Root and NET_RAW are isolated to this explicit profile.
    user: root
    command: ["serve", "--host", "127.0.0.1", "--port", "9090"]
    environment:
      HOME: /var/lib/agentsniff
      AGENTSNIFF_TARGET_NETWORK: 192.168.1.0/24
    cap_add:
      - NET_RAW
    cap_drop:
      - ALL
    restart: unless-stopped
    volumes:
      # Separate root-owned state; never chmod/chown the standard service's volume.
      - agentsniff-passive-state:/var/lib/agentsniff

volumes:
  agentsniff-state:
  agentsniff-passive-state:
