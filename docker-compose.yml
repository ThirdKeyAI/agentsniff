services:
  agentsniff:
    build: .
    container_name: agentsniff
    # The process binds non-loopback inside the container, so a strong API
    # token is mandatory even though the published host port is loopback-only.
    ports:
      - "127.0.0.1:9090:9090"
    command: ["serve", "--host", "0.0.0.0", "--port", "9090"]
    environment:
      AGENTSNIFF_API_TOKEN: ${AGENTSNIFF_API_TOKEN:?Set a 32-byte-or-longer AGENTSNIFF_API_TOKEN}
      AGENTSNIFF_TARGET_NETWORK: 192.168.1.0/24
      AGENTSNIFF_ENABLE_DNS_MONITOR: "false"
      AGENTSNIFF_ENABLE_TLS_FINGERPRINT: "false"
      AGENTSNIFF_ENABLE_TRAFFIC_ANALYZER: "false"
    restart: unless-stopped
    volumes:
      - agentsniff-state:/home/agentsniff/.agentsniff

  # Opt-in host-network profile for passive capture. The dashboard still binds
  # only to host loopback; NET_RAW/NET_ADMIN are not granted to the default service.
  agentsniff-passive:
    profiles: ["passive"]
    build: .
    container_name: agentsniff-passive
    network_mode: host
    # Root is isolated to this explicit profile and receives only the two
    # network capabilities required by passive capture.
    user: root
    command: ["serve", "--host", "127.0.0.1", "--port", "9090"]
    environment:
      AGENTSNIFF_TARGET_NETWORK: 192.168.1.0/24
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: unless-stopped
    volumes:
      - agentsniff-state:/home/agentsniff/.agentsniff

volumes:
  agentsniff-state:
